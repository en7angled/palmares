name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  haskell:
    runs-on: ubuntu-24.04-arm     # arm64: same arch as the target cluster
    timeout-minutes: 350          # the first uncached run is the expensive one; GitHub's max is 360

    # The palmares schema is views over db-sync's public schema, so its tests need a real
    # PostgreSQL: enums, domains and jsonb have no SQLite equivalent. Each test creates and
    # drops its own database on this server, so they neither share rows nor depend on order.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: devonly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # FIRST, because it costs under a second and the failures it catches otherwise cost an hour
      # each — or stay invisible, which is worse.
      #
      # A path in `extra-source-files` with no matching COPY in the service Dockerfiles breaks the
      # IMAGE build and nothing else — `cabal build` and `cabal test` stay green, because the file is
      # right there in the working tree. `images.yml` then spends an hour on the shared base image
      # before all four services die on `cabal: sdist … filepath wildcard`. That is measured, not
      # hypothetical: it is how `resources/` landed.
      #
      # The script's second half derives the `embedFile` path set from `src/**` and requires every
      # path to be in the `dist-newstyle` cache key below, in `extra-source-files`, and counted by
      # the embed-vs-disk case in `UnitTests.Views`. That is the structural version of the comment
      # on that cache step: the key was repaired by hand and was still missing
      # `test/fixtures/dbsync-skeleton.sql`, so the completeness of the list is now derived rather
      # than asserted.
      #
      # Placed before the apt and blst steps so it reports in seconds rather than after the build.
      - name: Everything packaged, and every embedFile input, is registered
        run: bash scripts/check_packaging.sh

      # The -dev packages below are not a wish list: every pkg-config dependency the frozen plan
      # forces has to be here, because the freeze pins the flag and leaves the solver no fallback.
      # `grep -E '\+(pkg-config|pkgconfig|use-pkg-config)' cabal.project.freeze` is the check —
      # today it names digest and zlib (zlib1g-dev), lzma (liblzma-dev), postgresql-libpq (libpq-dev).
      # liblzma-dev was added after a real run failed with
      #   rejecting: lzma:+pkgconfig (conflict: pkg-config package liblzma>=5.2.2, not found)
      #
      # `libblst-dev` is deliberately absent: it does not exist in the arm64 Ubuntu archive —
      # measured, not assumed, from a probe run that failed with
      # "E: Unable to locate package libblst-dev". blst is built from source in the next step.
      - name: System libraries for plutus-tx / cardano-crypto
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libffi-dev libgmp-dev \
            libssl-dev libtinfo-dev libsystemd-dev zlib1g-dev libpq-dev liblmdb-dev \
            liblzma-dev libsodium-dev libsecp256k1-dev
          # fail loudly here rather than inside the solver's backjumping output
          for pc in zlib liblzma libpq libsodium libsecp256k1; do
            pkg-config --exists "$pc" || { echo "pkg-config package missing: $pc"; exit 1; }
          done

      - name: blst from source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.3.15 https://github.com/supranational/blst /tmp/blst
          cd /tmp/blst
          ./build.sh
          sudo cp bindings/blst_aux.h bindings/blst.h bindings/blst.hpp /usr/include/
          sudo cp libblst.a /usr/lib/
          sudo tee /usr/lib/pkgconfig/libblst.pc >/dev/null <<'PC'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=${exec_prefix}/lib
          includedir=${prefix}/include

          Name: libblst
          Description: Multilingual BLS12-381 signature library
          URL: https://github.com/supranational/blst
          Version: 0.3.15
          Cflags: -I${includedir}
          Libs: -L${libdir} -lblst
          PC

      # cardano-crypto-class asks pkg-config for `libblst-any`, which no distribution ships under that
      # name. The probe measured it MISSING before this alias and 0.3.15 after it.
      - name: libblst-any alias
        run: |
          set -euo pipefail
          sed 's/^Name: libblst/Name: libblst-any/' /usr/lib/pkgconfig/libblst.pc \
            | sudo tee /usr/lib/pkgconfig/libblst-any.pc >/dev/null
          pkg-config --modversion libblst libblst-any

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.6.6"      # forced by plutus-tx-plugin; do not widen
          cabal-version: "3.10"

      # TD-03. TWO ENTRIES, because the two directories have opposite restore rules.
      #
      # The cabal STORE is content-addressed: every path in it is a built package keyed by its own
      # hash, so restoring an older one can only ever supply packages that are still correct. A loose
      # `restore-keys` is right there and saves most of the build.
      #
      # `dist-newstyle` is THIS package's object files and its resolved build plan, and it was keyed
      # on `cabal.project.freeze` and `cabal.project` only — not on `palmares.cabal`. So a change to
      # `ghc-options`, to a flag's `default:`, or to the module list did not invalidate it, and the
      # `restore-keys` fallback would restore ANY previous cache on top of that. A `-Wall` addition
      # or a plugin flag could therefore go un-rebuilt, which makes CI something other than the fresh
      # checkout the trace-code commit assumed it was.
      #
      # So: `palmares.cabal` in the key, and NO restore-keys. A near-miss restore is the defect, not
      # a saving — on a miss the package rebuilds, which is the only answer that is always correct.
      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-${{ runner.arch }}-ghc9.6.6-store-${{ hashFiles('cabal.project.freeze', 'cabal.project') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-ghc9.6.6-store-

      # `sql/**`, `resources/**` and `test/fixtures/*.sql` ARE IN THE KEY, and that is not an
      # optimisation. Those files are compiled into the binaries with `embedFile`, and cabal does not
      # track an `embedFile` dependency under this toolchain — measured: editing one line of
      # `sql/030_metrics.sql` recompiles nothing. With them out of the key, a pull request touching
      # only SQL got an exact cache hit, nothing rebuilt, and every Haskell gate ran the PREVIOUS
      # version of the DDL — including the "metric documentation is not stale" diff, which then
      # compared the old embed against the old document and passed. `UnitTests.Views` asserts the
      # same thing from inside the binary; this line is what stops the cache from serving one that is
      # already wrong.
      #
      # `test/fixtures/*.sql` was the one still missing, and it is the worst of the set to lose:
      # `test/fixtures/dbsync-skeleton.sql` is `Test.Pg`'s embed, the db-sync shape that all 35
      # database cases are built on, so a stale copy would have them assert against the OLD shape
      # — a renamed db-sync column would pass. The glob matches `extra-source-files`' own spelling,
      # and `scripts/check_packaging.sh` now derives this list from the sources rather than trusting
      # this comment, which is what let the gap exist.
      - uses: actions/cache@v4
        with:
          path: dist-newstyle
          key: ${{ runner.os }}-${{ runner.arch }}-ghc9.6.6-dist-${{ hashFiles('cabal.project.freeze', 'cabal.project', 'palmares.cabal', 'sql/**', 'resources/**', 'test/fixtures/*.sql') }}

      - run: cabal update
      - run: cabal build all --enable-tests

      # PALMARES_REQUIRE_FIXTURE_GATE is deliberately NOT set on this step. The eight epoch-319
      # cases need a caught-up preprod db-sync — about seven hours to build — which this runner
      # cannot have, so under the gate they would fail every run. Here they skip, loudly, on stderr;
      # the third of these test steps is what stops that skip from ever reading as a pass again.
      - name: cabal test (serial)
        run: cabal test all --test-show-details=direct
        env:
          # Test.Pg dies naming this variable when it is unset, so a database test can never
          # read as a pass just because the server was missing.
          PALMARES_TEST_PG_CONN_STR: host=localhost user=postgres password=devonly dbname=postgres port=5432

      # AND at -j4, because `src/test/Test/Pg.hs` claims both work and only the serial run was ever
      # executed. The claim has teeth: the scratch database name used to be per PROCESS, so two
      # concurrent cases shared one database and each one's `DROP … WITH (FORCE)` killed the other's
      # pool — measured at 84 failures of 706 under `-j4` against none serially. The per-CALL name
      # is the fix, and a fix whose only evidence is a comment is a hope. This step is the evidence.
      #
      # It re-uses the binary the step above built, so it costs one more test run and no rebuild.
      # The one piece of cluster-wide state left in the suite is `palmares_ro` in UnitTests.Views,
      # created by a single case, so there is no second creator to race it.
      - name: cabal test (-j4, so the per-call scratch database name stays proven)
        run: cabal test all --test-show-details=direct --test-options='-j4'
        env:
          PALMARES_TEST_PG_CONN_STR: host=localhost user=postgres password=devonly dbname=postgres port=5432

      # TD-14, asserted by its own failure. All eight epoch-319 cases reported `OK` with
      # PALMARES_FIXTURE_PG_CONN_STR unset, so every CI run above read as "the fixture gate passed"
      # while the gate had executed no statement at all. CI cannot supply that database, so what it
      # CAN gate is the property that was broken: a skip must never be a pass. With
      # PALMARES_REQUIRE_FIXTURE_GATE set and the connection string absent, the group must fail, it
      # must fail naming the gate, and NO case in it may report OK.
      #
      # TASTY_PATTERN rather than `--test-options`, which cabal splits on whitespace: the group's
      # name has spaces in it, and every shorter pattern ("fixture", "epoch") also selects cases in
      # other modules that legitimately pass. Filtered this way the step runs eight cases in
      # seconds and no emulator.
      - name: a skipped fixture case is a failure, not a green tick
        run: |
          set -uo pipefail
          out=$(cabal test all --test-show-details=direct 2>&1) && rc=0 || rc=$?
          echo "$out"
          [ "$rc" != 0 ] || { echo "the gate did not fire: a skipped fixture case still passes"; exit 1; }
          grep -q PALMARES_REQUIRE_FIXTURE_GATE <<<"$out" \
            || { echo "it failed, but for something other than the gate"; exit 1; }
          ok=$(grep -cE ': +OK' <<<"$out" || true)
          [ "$ok" = 0 ] || { echo "$ok fixture case(s) still reported OK under the gate"; exit 1; }
        env:
          PALMARES_TEST_PG_CONN_STR: host=localhost user=postgres password=devonly dbname=postgres port=5432
          PALMARES_REQUIRE_FIXTURE_GATE: "1"
          TASTY_PATTERN: /preprod epoch-320 fixture/

      # docs/metrics.md is generated from the metric catalog and committed. Regenerate and diff:
      # the published prose and the SQL the API runs come out of the same files, so a formula
      # cannot change without the documentation changing in the same commit.
      #
      # This command needs no provider, no signing key and no deployed-validators config, which
      # is what makes it runnable here at all.
      - name: metric documentation is not stale
        run: |
          set -euo pipefail
          cabal run -v0 exe:admin -- write-metrics-doc
          git diff --exit-code docs/metrics.md

      # `reconcile-koios` promises four exit codes and the nightly's whole value is that 2 ("nobody
      # answered") and 1 ("the two answers differ") are different events. That promise was broken for
      # as long as it existed: the fetch caught `IOError`, which `httpLbs` never throws, so a refused
      # connection escaped to the top and GHC's uncaught-exception code 1 read as a parity finding.
      # Reconcile run 39697594482 is the measurement.
      #
      # Port 1 is reserved and nothing listens on it, so this needs no service, no network and no
      # deployment — it fails in milliseconds, which is the only reason a live exit-code assertion
      # belongs in this job at all. The message is asserted too: `loadSample` failing would also
      # exit 2, and a check that cannot tell those apart would pass with the fetch still broken.
      - name: an unreachable API exits 2, not 1
        run: |
          set -uo pipefail
          out=$(PALMARES_API=http://127.0.0.1:1/api cabal run -v0 exe:admin -- \
                  reconcile-koios --out out/ci-exit-code.json 2>&1) && rc=0 || rc=$?
          echo "$out"
          [ "$rc" = 2 ] || { echo "expected exit 2, got $rc"; exit 1; }
          grep -q '127.0.0.1:1/api/status' <<<"$out" \
            || { echo "exit 2 for the wrong reason: the message does not name the fetch"; exit 1; }

#           git diff --exit-code docs/metrics.md
# in the existing `haskell` job (keep one blank line between the two steps).

      # docs/generated/swagger/query-swagger-api.json is generated from the SERVED API type and
      # committed, so the routes and the frontend's `gen:api` input cannot drift apart. Regenerate
      # and diff, exactly as the metric doc above.
      #
      # --write-swagger-only writes the file from the pure apiSwagger value and exits before any
      # config, pool or schema wiring, which is what makes this runnable here: no Postgres service,
      # no DSN, no port. It is a step in this job rather than a job of its own because the binary
      # is already built and cached here; a separate job would pay for a second cold build.
      # BOTH documents. The interaction API's was neither committed nor regenerated here until the
      # attestation kind/period work generated it by hand and found a wrong enum spelling in it —
      # the published values were the constructor names while the API accepts snake_case. A document
      # outside the gate is a document that can say anything.
      - name: Swagger documents are not stale
        run: |
          set -euo pipefail
          cabal run -v0 exe:query-api -- --write-swagger-only
          cabal run -v0 exe:interaction-api -- --write-swagger-only
          git diff --exit-code docs/generated/swagger/

      # The diff above catches the document falling behind the code. It cannot catch the two
      # agreeing on something wrong, so the contract's load-bearing facts are asserted by value:
      # the path set, the 24 error codes a client branches on, and the parameters that must exist
      # or must not. Runs on the file the step above just regenerated.
      - name: Swagger contract holds
        run: bash scripts/check_swagger.sh

      # The attestation rename's failure mode is PARTIAL: the compiler is happy with half of it, and
      # the halves that reach a user — a Swagger title, an error message, a JSON key — are the ones it
      # never looks at. Runs here rather than in `haskell` because it reads the regenerated Swagger
      # the two steps above produce.
      - name: Vocabulary is the attestation domain, everywhere
        run: bash scripts/check_vocabulary.sh

  # F1 check 3, over the seeded db-sync skeleton rather than the real synced database, so it
  # blocks merges without needing preprod. The against-preprod run is the one that SIGNS check 3
  # — the skeleton has empty tables, so it proves the statements parse and are self-consistent,
  # not that they are stable over real rows.
  #
  # No Haskell build: this job reads resources/metric-formulas.json and resources/metrics/*.sql
  # directly, which is the whole reason it can gate a pull request in a minute.
  determinism:
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: devonly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: psql
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # The same two files the Haskell tests use, applied in the same order: db-sync's shape, then
      # the palmares views over it. If the schema does not apply, this job fails before it can
      # report anything about determinism, which is the right order of blame.
      - name: db-sync skeleton and the palmares schema
        run: |
          set -euo pipefail
          psql "$PG_CONN_STR" -v ON_ERROR_STOP=1 -q -f test/fixtures/dbsync-skeleton.sql
          for f in sql/000_schema.sql sql/010_gov_views.sql sql/020_views.sql sql/030_metrics.sql; do
            psql "$PG_CONN_STR" -v ON_ERROR_STOP=1 -q -f "$f"
          done
        env:
          PGPASSWORD: devonly
          PG_CONN_STR: host=localhost user=postgres dbname=postgres port=5432

      - name: every metric statement gives the same answer twice
        run: scripts/check_determinism.sh
        env:
          PGPASSWORD: devonly
          PG_CONN_STR: host=localhost user=postgres dbname=postgres port=5432

      # GV-25. The seven files in sql/checks/ are the authority on view correctness — 135 ASSERTs —
      # and NOTHING ran them, so a column renamed in sql/020_views.sql left a check file that no
      # longer resolved and nobody knew until the next by-hand `psql -f`. They go here rather than in
      # a job of their own because the step above has already seeded this database with exactly what
      # they need: the db-sync skeleton and sql/000..030. MEASURED at about 7 seconds for all seven.
      #
      # What it proves: every file executes end to end and every identifier in all 135 conditions
      # resolves against the real schema. What it cannot: anything that needs rows — a wrong number,
      # a join that fans out, a partition that is no longer total. The script's header explains the
      # rewrite that makes a magnitude assertion non-fatal here without making it unchecked, and
      # carries the preprod command that SIGNS these checks (7/7 at tip epoch 321, 2026-10-24).
      - name: every sql/checks file resolves against the schema (GV-25)
        run: scripts/check_sql_checks.sh
        env:
          PGPASSWORD: devonly
          PG_CONN_STR: host=localhost user=postgres dbname=postgres port=5432

      # Role separation had no gate at all, and the hole that hid was on the only path there is:
      # `palmares_attest.chain_cursor` is created by attest-sync, which every committed
      # configuration connects as `postgres`, so the `ALTER DEFAULT PRIVILEGES FOR ROLE
      # palmares_owner` in sql/050_roles.sql covered nothing and `palmares_ro` could not read the
      # table. That failure is unreadable from outside — information_schema lists only what the role
      # may see, so a missing grant and an absent table are the same observation, and /status serves
      # `attest_lag_seconds: null` either way.
      #
      # Its own database because sql/050_roles.sql names `cexplorer`, which is db-sync's and the one
      # the grants are written for. A second copy of the skeleton there costs about a second.
      - name: role separation, and the grant attest-sync's table depends on
        run: |
          set -euo pipefail
          createdb -h localhost -U postgres cexplorer
          psql "$CEX" -v ON_ERROR_STOP=1 -q -f test/fixtures/dbsync-skeleton.sql
          psql "$CEX" -v ON_ERROR_STOP=1 -q -f sql/050_roles.sql
          # attest-sync's boot DDL, in the order that used to lose the grant: roles first, table after
          psql "$CEX" -v ON_ERROR_STOP=1 -q -c 'CREATE TABLE palmares_attest.chain_cursor (slot_no bigint)'
          PSQL="psql postgresql://postgres@localhost:5432/cexplorer" DBSYNC_ROLE=postgres scripts/check_roles.sh
          # and what the default privilege exists for: query-api's reader can actually read it
          psql "$CEX" -v ON_ERROR_STOP=1 -At -c 'SET ROLE palmares_ro; SELECT count(*) FROM palmares_attest.chain_cursor'
        env:
          PGPASSWORD: devonly
          CEX: host=localhost user=postgres dbname=cexplorer port=5432

  secrets:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                    # full history: leak #2 was a token COMMITTED

      # The repo's own guard, run against the checked-out tree. Cheap, dependency-free, and the same
      # code the pre-push hook runs, so local and CI cannot disagree.
      - run: .githooks/pre-push

      # Depth beyond the regex: full-history, rule-based detection with entropy checks.
      #
      # The BINARY, not gitleaks/gitleaks-action@v2. gitleaks itself is MIT/Apache-licensed and free;
      # only the Action wrapper is license-gated, and it refuses to run for any organisation-owned
      # repository regardless of visibility: "[en7angled] is an organization. License key is required."
      # Measured, not guessed — that is how this job failed its first run. Running the binary keeps a
      # gate that actually decides something, with no paid dependency.
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_arm64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks git --redact --no-banner --exit-code 1 .

      # .gitleaks.toml turns ONE rule off — generic-api-key — in four narrow places, because it
      # cannot tell a published on-chain credential from a secret. Only the first is scoped by PATH
      # (the Koios wire recordings); the other three are scoped by the VALUE'S SHAPE, which is
      # strictly narrower: CHaP's root keys, bech32 governance identifiers, and raw 28-byte
      # credential hashes. An allowlist that is never tested is an allowlist nobody notices going
      # wide, so the script below plants a real-looking secret in each narrowed place and asserts
      # the gate still fails — including a 32-byte hex value, which must stay caught, or the
      # 28-byte entry would mean "hex is fine".
      - name: the gitleaks allowlist is rule-scoped, not path-scoped
        run: bash scripts/check_gitleaks_allowlist.sh /tmp/gitleaks
