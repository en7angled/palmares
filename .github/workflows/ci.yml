name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  haskell:
    runs-on: ubuntu-24.04-arm     # arm64: same arch as the target cluster
    timeout-minutes: 350          # the first uncached run is the expensive one; GitHub's max is 360

    # The palmares schema is views over db-sync's public schema, so its tests need a real
    # PostgreSQL: enums, domains and jsonb have no SQLite equivalent. Each test creates and
    # drops its own database on this server, so they neither share rows nor depend on order.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: devonly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # The -dev packages below are not a wish list: every pkg-config dependency the frozen plan
      # forces has to be here, because the freeze pins the flag and leaves the solver no fallback.
      # `grep -E '\+(pkg-config|pkgconfig|use-pkg-config)' cabal.project.freeze` is the check —
      # today it names digest and zlib (zlib1g-dev), lzma (liblzma-dev), postgresql-libpq (libpq-dev).
      # liblzma-dev was added after a real run failed with
      #   rejecting: lzma:+pkgconfig (conflict: pkg-config package liblzma>=5.2.2, not found)
      #
      # `libblst-dev` is deliberately absent: it does not exist in the arm64 Ubuntu archive —
      # measured, not assumed, from a probe run that failed with
      # "E: Unable to locate package libblst-dev". blst is built from source in the next step.
      - name: System libraries for plutus-tx / cardano-crypto
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libffi-dev libgmp-dev \
            libssl-dev libtinfo-dev libsystemd-dev zlib1g-dev libpq-dev liblmdb-dev \
            liblzma-dev libsodium-dev libsecp256k1-dev
          # fail loudly here rather than inside the solver's backjumping output
          for pc in zlib liblzma libpq libsodium libsecp256k1; do
            pkg-config --exists "$pc" || { echo "pkg-config package missing: $pc"; exit 1; }
          done

      - name: blst from source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.3.15 https://github.com/supranational/blst /tmp/blst
          cd /tmp/blst
          ./build.sh
          sudo cp bindings/blst_aux.h bindings/blst.h bindings/blst.hpp /usr/include/
          sudo cp libblst.a /usr/lib/
          sudo tee /usr/lib/pkgconfig/libblst.pc >/dev/null <<'PC'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=${exec_prefix}/lib
          includedir=${prefix}/include

          Name: libblst
          Description: Multilingual BLS12-381 signature library
          URL: https://github.com/supranational/blst
          Version: 0.3.15
          Cflags: -I${includedir}
          Libs: -L${libdir} -lblst
          PC

      # cardano-crypto-class asks pkg-config for `libblst-any`, which no distribution ships under that
      # name. The probe measured it MISSING before this alias and 0.3.15 after it.
      - name: libblst-any alias
        run: |
          set -euo pipefail
          sed 's/^Name: libblst/Name: libblst-any/' /usr/lib/pkgconfig/libblst.pc \
            | sudo tee /usr/lib/pkgconfig/libblst-any.pc >/dev/null
          pkg-config --modversion libblst libblst-any

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.6.6"      # forced by plutus-tx-plugin; do not widen
          cabal-version: "3.10"

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-${{ runner.arch }}-ghc9.6.6-${{ hashFiles('cabal.project.freeze', 'cabal.project') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-ghc9.6.6-

      - run: cabal update
      - run: cabal build all --enable-tests
      - run: cabal test all --test-show-details=direct
        env:
          # Test.Pg dies naming this variable when it is unset, so a database test can never
          # read as a pass just because the server was missing.
          PALMARES_TEST_PG_CONN_STR: host=localhost user=postgres password=devonly dbname=postgres port=5432

      # docs/metrics.md is generated from the metric catalog and committed. Regenerate and diff:
      # the published prose and the SQL the API runs come out of the same files, so a formula
      # cannot change without the documentation changing in the same commit.
      #
      # This command needs no provider, no signing key and no deployed-validators config, which
      # is what makes it runnable here at all.
      - name: metric documentation is not stale
        run: |
          set -euo pipefail
          cabal run -v0 exe:admin -- write-metrics-doc
          git diff --exit-code docs/metrics.md

#           git diff --exit-code docs/metrics.md
# in the existing `haskell` job (keep one blank line between the two steps).

      # docs/generated/swagger/query-swagger-api.json is generated from the SERVED API type and
      # committed, so the routes and the frontend's `gen:api` input cannot drift apart. Regenerate
      # and diff, exactly as the metric doc above.
      #
      # --write-swagger-only writes the file from the pure apiSwagger value and exits before any
      # config, pool or schema wiring, which is what makes this runnable here: no Postgres service,
      # no DSN, no port. It is a step in this job rather than a job of its own because the binary
      # is already built and cached here; a separate job would pay for a second cold build.
      - name: Swagger document is not stale
        run: |
          set -euo pipefail
          cabal run -v0 exe:query-api -- --write-swagger-only
          git diff --exit-code docs/generated/swagger/

      # The diff above catches the document falling behind the code. It cannot catch the two
      # agreeing on something wrong, so the contract's load-bearing facts are asserted by value:
      # the path set, the 24 error codes a client branches on, and the parameters that must exist
      # or must not. Runs on the file the step above just regenerated.
      - name: Swagger contract holds
        run: bash scripts/check_swagger.sh

  # F1 check 3, over the seeded db-sync skeleton rather than the real synced database, so it
  # blocks merges without needing preprod. The against-preprod run is the one that SIGNS check 3
  # — the skeleton has empty tables, so it proves the statements parse and are self-consistent,
  # not that they are stable over real rows.
  #
  # No Haskell build: this job reads resources/metric-formulas.json and resources/metrics/*.sql
  # directly, which is the whole reason it can gate a pull request in a minute.
  determinism:
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: devonly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: psql
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # The same two files the Haskell tests use, applied in the same order: db-sync's shape, then
      # the palmares views over it. If the schema does not apply, this job fails before it can
      # report anything about determinism, which is the right order of blame.
      - name: db-sync skeleton and the palmares schema
        run: |
          set -euo pipefail
          psql "$PG_CONN_STR" -v ON_ERROR_STOP=1 -q -f test/fixtures/dbsync-skeleton.sql
          for f in sql/000_schema.sql sql/010_gov_views.sql sql/020_views.sql sql/030_metrics.sql; do
            psql "$PG_CONN_STR" -v ON_ERROR_STOP=1 -q -f "$f"
          done
        env:
          PGPASSWORD: devonly
          PG_CONN_STR: host=localhost user=postgres dbname=postgres port=5432

      - name: every metric statement gives the same answer twice
        run: scripts/check_determinism.sh
        env:
          PGPASSWORD: devonly
          PG_CONN_STR: host=localhost user=postgres dbname=postgres port=5432

  secrets:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                    # full history: leak #2 was a token COMMITTED

      # The repo's own guard, run against the checked-out tree. Cheap, dependency-free, and the same
      # code the pre-push hook runs, so local and CI cannot disagree.
      - run: .githooks/pre-push

      # Depth beyond the regex: full-history, rule-based detection with entropy checks.
      #
      # The BINARY, not gitleaks/gitleaks-action@v2. gitleaks itself is MIT/Apache-licensed and free;
      # only the Action wrapper is license-gated, and it refuses to run for any organisation-owned
      # repository regardless of visibility: "[en7angled] is an organization. License key is required."
      # Measured, not guessed — that is how this job failed its first run. Running the binary keeps a
      # gate that actually decides something, with no paid dependency.
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_arm64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks git --redact --no-banner --exit-code 1 .
