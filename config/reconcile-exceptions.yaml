  # ----------------------------------------------------------------------------------------------
  # R2: three DEFINITIONAL differences, each one fact about one field rather than a fact about the
  # DReps that happen to show it. `key: "*"` is the field-level form; it still requires a field.
  #
  # active_until_epoch / status — db-sync records the ledger's DRep deadline ONLY in drep_distr,
  # and drep_distr holds a row only for a DRep the ledger included in that epoch's distribution.
  # MEASURED at epoch 320: 90 of preprod's 294 registered DReps have NEVER had a drep_distr row,
  # at any epoch, so we have no deadline for them and `active_until_epoch` is null. `status` then
  # falls back to `inactive`, which Koios agrees with for 69 of the 90 and contradicts for 21
  # (Koios computes the deadline itself: 320-340 for those 21, 185-224 for the 69).
  #
  # The obvious flip — "unknown deadline means active" — was implemented, measured and REVERTED:
  # it would be wrong for 69 to fix 21. Deriving the deadline was also measured and rejected:
  # `max(last cert, last vote) + drep_activity` disagrees with the ledger's own value by up to 5
  # epochs, because CIP-1694 does not count DORMANT epochs toward inactivity, and reimplementing
  # that accounting would be a second derivation that can disagree with the ledger.
  #
  # THE HONEST FIX IS AN API DECISION, NOT A SCHEMA ONE: publish a third status for "registered,
  # deadline unknown". DRepStatus is a published enum and adding a value breaks every exhaustive
  # match a client has written, so it is the user's call, not this file's.
  - row: R2
    key: "*"
    field: active_until_epoch
    reason: "db-sync records the ledger's DRep deadline only in drep_distr; 90 of 294 registered DReps have never had a row there, so we publish null. Re-deriving it needs CIP-1694's dormant-epoch accounting (measured: a naive derivation is off by up to 5 epochs)."
    opened: 2026-10-21
    owner: it@blazarlabs.io
  - row: R2
    key: "*"
    field: status
    reason: "Follows from active_until_epoch being null: `inactive` is the fallback, right for 69 of those 90 DReps and wrong for 21. The 'unknown means active' flip was tried and reverted — it would be wrong for 69 to fix 21. The fix is a third published status, which is an API decision."
    opened: 2026-10-21
    owner: it@blazarlabs.io
  # delegator_count — two different questions, not two answers to one. Ours counts DELEGATIONS in
  # force; Koios's live_delegator_count counts delegators with STAKE in the current snapshot.
  # MEASURED: 7 DReps differ, ours is higher in every one, and every excess delegator has
  # `lovelace: null` — no row in the latest epoch_stake. The fixture DRep agrees at 13 because all
  # 13 of its delegators hold stake.
  #
  # Ours is the number this registry wants: a delegator with no stake still CHOSE that DRep, and a
  # count that dropped them would make a DRep's support look like its stake.
  - row: R2
    key: "*"
    field: delegator_count
    reason: "Ours counts delegations in force; Koios counts delegators with stake in the current epoch_stake snapshot. Measured: 7 DReps differ, ours always higher, and every excess delegator has zero stake. A delegator with no stake still chose that DRep."
    opened: 2026-10-21
    owner: it@blazarlabs.io
