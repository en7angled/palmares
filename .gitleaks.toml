# gitleaks configuration. CI runs `gitleaks git --redact --exit-code 1 .` over the FULL history.
#
# This file EXTENDS the default rule set — it does not replace it. Every rule gitleaks ships with
# still runs; what follows narrows exactly one of them, on exactly one path, for a reason.

[extend]
useDefault = true

# `generic-api-key` on the recorded fixtures — BOTH sets.
#
# WHAT IT FIRES ON: the governance-proposal list as Koios serves it, including each proposal's
# `meta_json` and `proposal_description` verbatim. A NewCommittee action's description names its
# members as `"keyHash": "<28 bytes of hex>"`, and `generic-api-key` matches a high-entropy value
# next to a field name containing "key". Measured: 81 findings in `test/fixtures/koios/` and 83 in
# `test/fixtures/snapshot/koios/`, all `generic-api-key`, every one of them an on-chain credential
# hash.
#
# The path covers `test/fixtures/` as a whole rather than the two directories separately, because
# both hold recorded wire from the same public endpoints and a third recording would otherwise be
# a surprise failure rather than a decision.
#
# WHY IT IS ALLOWLISTED RATHER THAN REMOVED: those hashes are PUBLIC BY CONSTRUCTION. They are on
# the Cardano chain, served by a public API, and they are the content a parity check compares. The
# alternative — trimming `meta_json` out of the recording — would make the fixture stop being the
# wire, which is the only thing it is for: a decoder that chokes on real proposal metadata is
# exactly what a wire fixture exists to catch.
#
# WHY THIS IS NOT A HOLE: the narrowing is one RULE on one PATH, not a path exclusion. Every other
# default rule — AWS keys, GitHub and Slack tokens, private-key blocks, JWTs — still runs over
# this directory, and `generic-api-key` is the only rule that cannot tell a public key hash from a
# secret. A real credential dropped in here would still fail the gate, and that is verified rather
# than assumed: `scripts/check_gitleaks_allowlist.sh` plants one and asserts it is caught.
#
# WHY `[[allowlists]]` WITH `targetRules` AND NOT A `[[rules]]` BLOCK: declaring a rule with an id
# the default config already uses REPLACES that rule, including its own built-in allowlists.
# Measured — the first attempt did exactly that, and it resurrected a finding the default rule had
# been suppressing all along: `root-keys:` in `cabal.project`, which is the CHaP package
# repository's public verification key. A top-level allowlist with `targetRules` leaves the
# default rule and its allowlists intact and only adds this path to them.
#
# The allowlist is by path and rule, not by fingerprint, so re-recording the fixtures does not
# require editing it.
[[allowlists]]
description = "Koios wire fixtures: on-chain credential hashes in proposal metadata, not secrets"
targetRules = ["generic-api-key"]
paths = ['''test/fixtures/.*\.json''']

# `generic-api-key` on `cabal.project`'s CHaP root keys.
#
# `root-keys:` in the `repository cardano-haskell-packages` stanza lists the package repository's
# PUBLIC verification keys — the fingerprints cabal checks CHaP's index signature against. They
# are published in CHaP's own README and sit in every Cardano project's cabal.project; the secret
# would be the signing half, which only CHaP's maintainers hold.
#
# This entry exists because `[extend] useDefault = true` plus a top-level allowlist does NOT
# inherit the default config's own global allowlist, which had been suppressing this. Measured:
# with no config file at all gitleaks reported 81 findings, all Koios; with the config it reported
# this one as well. Spelling it out is better than relying on a stopword nobody can see — the
# reason the value is not a secret is now written down next to it.
[[allowlists]]
description = "cabal.project: CHaP's public repository verification keys"
targetRules = ["generic-api-key"]
paths = ['''cabal\.project$''']
regexTarget = "match"
regexes = ['''root-keys''']

# `generic-api-key` on bech32 GOVERNANCE IDENTIFIERS, wherever they appear.
#
# WHAT IT FIRED ON: `drepKeyBech32 = "drep1y2qn0rf…"` in `src/test/UnitTests/WritePath.hs` — a
# CIP-129 DRep id, one of the golden vectors the claim path is tested against. The rule matched a
# high-entropy value next to an identifier containing "Key", and the binding is named for the
# credential KIND (key vs script), which is the distinction the test exists to pin. Its three
# siblings on the next lines — `drepScriptBech32`, `drepCip105`, `ccColdBech32` — carry the same
# 28 bytes and did NOT fire, which is the whole diagnosis: the gate read the NAME, not the value.
# `UnitTests.GovIds` has pinned these same vectors since T-ATTEST-2 and never tripped it either.
#
# WHY THIS ENTRY IS SCOPED BY VALUE SHAPE AND NOT BY PATH: a path allowlist would excuse every
# future high-entropy string in that file, including a real one. A bech32 string whose human-
# readable part is a Cardano governance HRP cannot be a credential — the payload is a 28-byte
# blake2b-224 credential hash (29 with CIP-129's header byte) plus a checksum over it, and the
# chain publishes it as the DRep's or committee member's public identity. There is no secret of
# that shape, so this narrowing cannot widen into one. It also means the next module that pins a
# governance id is not a surprise CI failure, which is the same reason the fixture entry above
# covers `test/fixtures/` whole.
#
# THE CHARACTER CLASS IS BECH32'S: digits and lowercase letters minus `1`, `b`, `i` and `o`, which
# is why `1` appears only as the separator. The length floor is 40: CIP-105 is 51 data+checksum
# characters and CIP-129 is 53, so 40 clears any truncation while refusing a short accident.
#
# Verified, not assumed: `scripts/check_gitleaks_allowlist.sh` plants an AWS key id in a binding
# named exactly like the one that fired and asserts the gate still catches it.
[[allowlists]]
description = "bech32 governance identifiers: public on-chain credentials, not secrets"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''\b(drep_script|drep|cc_cold|cc_hot)1[02-9ac-hj-np-z]{40,}\b''']

# `generic-api-key` on a RAW blake2b-224 credential hash — the same value as the entry above, in the
# other encoding.
#
# WHAT IT FIRED ON: `hexCredential = "81378d3e…"` at `src/test/UnitTests/AttestRead.hs:126`. The
# diagnosis is the one above, repeated and therefore no longer a coincidence: that binding's three
# siblings two lines up — `keyCredential`, `scriptCredential`, `cip105Credential` — are the SAME 28
# bytes, and they did not fire, because they are computed from `credentialRaw` instead of written as
# a literal. Nor did `otherRaw` on line 120, which is also 56 hex characters, nor `txIdHex` on 131,
# which is 64. Repository-wide there are 15 such literals across 9 test modules and exactly one
# tripped the gate. What `generic-api-key` actually reacted to is the word "Credential" in an
# identifier next to a high-entropy value. It read the NAME.
#
# WHY 56 HEX CHARACTERS IS A SHAPE NO SECRET HAS: 56 lowercase hex is exactly 28 bytes, which is
# blake2b-224 — Cardano's credential-hash width, used for payment key hashes, script hashes and DRep
# credentials, all of them published on chain as public identities. Issued secrets are 16, 24, 32 or
# 64 bytes; nothing mints a 28-byte key. So this narrowing has no secret to widen into, which is the
# same argument the bech32 entry makes and the reason both are scoped by value and not by path.
#
# THE QUOTES IN THE PATTERN ARE LOAD-BEARING. `"[0-9a-f]{56}"` requires the 56 hex characters to be
# the WHOLE quoted literal. Without them, `\b[0-9a-f]{56}\b` would also excuse a 56-hex substring of
# a longer secret — a 64-hex key contains sixteen of them.
#
# Verified, not assumed: `scripts/check_gitleaks_allowlist.sh` plants four values under this exact
# binding name and asserts that only the credential passes — an AWS key id still trips the gate, and
# so does a 64-hex value, which is what proves the entry is bounded by the 28-byte width rather than
# by "hex is fine".
[[allowlists]]
description = "raw blake2b-224 credential hashes: 28 bytes, the width no secret is issued at"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''"[0-9a-f]{56}"''']
