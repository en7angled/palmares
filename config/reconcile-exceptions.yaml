# Documented divergences against Koios preprod (F1 check 6: "explained divergences are documented").
#
# An entry here turns ONE divergence from `unexplained` into `explained`. It suppresses nothing
# else: the divergence still appears in the report, under `explained`, with this entry's reason
# beside it. A waiver that made a difference disappear would be a way to make the check pass by
# editing a file.
#
# An entry that matches no divergence in a run is reported as `stale_exceptions` — delete it. That
# report line is also the only signal that a divergence was FIXED: the waiver outliving the problem
# is what tells you the problem is gone.
#
#   row:    R1 … R10. Numbered, not named after the subject, so an entry keeps meaning the same row
#           when the row's description is reworded.
#   key:    the row's comparison key verbatim as the report prints it (a CIP-129 id, "<id>:<epoch>", …)
#   field:  one field name; OMIT to explain every field of that key. Omitting it is the usual shape
#           for a legitimate waiver — one decision, not six.
#   reason: what the difference is and why it is not a defect. Required.
#   opened: the date it was accepted, YYYY-MM-DD. Required.
#   owner:  who accepted it. Required.
#
# All three of reason/opened/owner are required because an undated, unowned, unexplained waiver is
# indistinguishable from a bug someone silenced.
#
# ------------------------------------------------------------------------------------------------
# R6: Koios drops a vote cast by a DRep that has since RETIRED. We keep it.
#
# Measured on gov_action108a5htq… — every other count on that action agrees exactly (committee yes
# 3, DRep yes 4, SPO yes 12) and the only difference is two DRep abstains that Koios does not list.
# Both abstainers are retired and absent from Koios's own registered `drep_list`, so its
# `/proposal_votes` has nothing to join them to.
#
# OURS IS THE RIGHT NUMBER, and it is right by our own published rule: the metric catalogue's
# edge-case list says "votes voided by DRep retirement still count as cast". A tally of cast votes
# that silently dropped retirees would SHRINK as DReps retire, rewriting what an action's vote
# looked like at the time it was decided.
#
# Five keys, one per affected action. `field` is omitted on each: the whole key is the difference —
# it is a membership divergence, not a count that is off by two.
exceptions:
  - row: R6
    key: "gov_action108a5htqnmlp89ffn2ucf7u9u33s0r9gpx7eytpdc2q28y50ly42qqf9jcen:drep:abstain"
    reason: "Koios omits votes by retired DReps from /proposal_votes; we count a cast vote as cast (metric catalogue, 'votes voided by DRep retirement still count as cast'). Both abstainers on this action are retired and absent from Koios's drep_list."
    opened: 2026-10-21
    owner: it@blazarlabs.io
  - row: R6
    key: "gov_action10md95hawtukx6yqmj33ndwpg7wxd35zdez88gazqkxhna9jzkgnszjwsmss:drep:abstain"
    reason: "Koios omits votes by retired DReps from /proposal_votes; we count a cast vote as cast."
    opened: 2026-10-21
    owner: it@blazarlabs.io
  - row: R6
    key: "gov_action18zuuryq7guh3xx85fgeyuazcj3ndwll5ff3u6d0sxj4gnx8u2w4qqfprex0:drep:abstain"
    reason: "Koios omits votes by retired DReps from /proposal_votes; we count a cast vote as cast."
    opened: 2026-10-21
    owner: it@blazarlabs.io
  - row: R6
    key: "gov_action1fu4jzn3cwvhdyl80zqrywzn6zc2h0h94ef3qkk222cnp2h7q0v2sqq6ac3a:drep:yes"
    reason: "Koios omits votes by retired DReps from /proposal_votes; we count a cast vote as cast."
