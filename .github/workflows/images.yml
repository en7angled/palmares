name: images
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# NOT on every push to main, and that is a measured decision rather than a preference.
#
# A service image is a full static musl Haskell build of the whole Cardano dependency tree: the
# shared builder base alone takes over an hour on an arm64 runner, and there are four services on
# top of it. With a main trigger plus cancel-in-progress, every run was cancelled by the next
# commit before it finished — so the workflow had never completed once, never populated its
# layer cache, and never produced an image. Hours of CI for nothing.
#
# Images exist to be deployed, and deployments happen at tags, so tags are when they are built.
# `workflow_dispatch` covers the case where someone wants an image off main anyway. compose.yaml's
# `:${TAG:-latest}` keeps working because the tag build pushes `:latest` too.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

# The GHCR namespace images are published under — OWNER DECISION 2026-10-21: `mariusgeorgescu`.
#
# Written out rather than taken from `${{ github.repository_owner }}`, which would make the namespace
# a side effect of wherever the repository happens to live — it resolved to `en7angled` until the
# repository was transferred, and a future move would silently rename every image again. One line
# decides it here; `compose.yaml`'s `${GH_OWNER:-…}` and `scripts/build-images.sh`'s `IMAGE_PREFIX`
# carry the same default so a local pull and a CI push name the same image.
#
# The image NAME is unchanged: `palmares-<svc>` was already `<repo>-<svc>`, so only the namespace moves.
env:
  GHCR_OWNER: mariusgeorgescu

jobs:
  # The two shared base images, PUSHED to GHCR rather than loaded into the local daemon.
  #
  # `docker buildx build --load` puts an image in the docker daemon's store, but
  # docker/build-push-action runs through the buildx container builder, which has its own store and
  # does not see it — so `FROM palmares-builder:9.6.6` fell through to docker.io/library and the
  # whole matrix failed with `pull access denied`. A registry is the only store both halves share.
  bases:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write          # GHCR only — no DOCKERHUB_* secrets at all. See the login step.
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: builder, file: Dockerfile.base, version: "9.6.6" }
          - { name: runtime-base, file: Dockerfile.runtime-base, version: "3.20" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_OWNER }}
          # `GITHUB_TOKEN` is scoped to the OWNER of the repository it runs in, and since the transfer
          # to `mariusgeorgescu` that owner IS the namespace above — so `packages: write` on the
          # per-run token is the whole credential and no PAT is needed. While the repository lived
          # under the `en7angled` org this push failed with `denied` whatever the permissions, because
          # `packages: write` only ever covers the owner's own packages; that is what the transfer fixed.
          #
          # Deliberately NOT `secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN`: `||` falls back on an UNSET
          # secret, not an expired one, so a stale PAT would outrank the token that actually works.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          # The :sha tag is what the service builds consume: it cannot be swapped under them by a
          # concurrent run the way a floating :version tag can. The :version tag is for humans.
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/palmares-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ env.GHCR_OWNER }}/palmares-${{ matrix.name }}:${{ matrix.version }}
          cache-from: type=gha,scope=base-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.name }}

  build:
    needs: bases
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        svc: [admin, query-api, interaction-api, attest-sync]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_OWNER }}
          # `GITHUB_TOKEN` is scoped to the OWNER of the repository it runs in, and since the transfer
          # to `mariusgeorgescu` that owner IS the namespace above — so `packages: write` on the
          # per-run token is the whole credential and no PAT is needed. While the repository lived
          # under the `en7angled` org this push failed with `denied` whatever the permissions, because
          # `packages: write` only ever covers the owner's own packages; that is what the transfer fixed.
          #
          # Deliberately NOT `secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN`: `||` falls back on an UNSET
          # secret, not an expired one, so a stale PAT would outrank the token that actually works.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.svc }}
          platforms: linux/arm64
          push: true
          # Overrides the Dockerfile defaults, which are the local tags a contributor builds.
          build-args: |
            BUILDER_IMAGE=ghcr.io/${{ env.GHCR_OWNER }}/palmares-builder:${{ github.sha }}
            RUNTIME_IMAGE=ghcr.io/${{ env.GHCR_OWNER }}/palmares-runtime-base:${{ github.sha }}
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/palmares-${{ matrix.svc }}:${{ github.sha }}
            ghcr.io/${{ env.GHCR_OWNER }}/palmares-${{ matrix.svc }}:latest
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}
