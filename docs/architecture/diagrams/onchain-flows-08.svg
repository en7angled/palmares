th="14" height="14"/></g><g class="node  statediagram-state" id="my-svg-state-Pending-2" data-look="classic" transform="translate(271.2265625, 164)"><rect class="basic label-container" style="" rx="5" ry="5" x="-35.9453125" y="-20" width="71.890625" height="40"/><g class="label" style="" transform="translate(-27.9453125, -12)"><rect/><foreignObject width="55.890625" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel markdown-node-label"><p>Pending</p></span></div></foreignObject></g></g><g class="node  statediagram-state" id="my-svg-state-Accepted-3" data-look="classic" transform="translate(384.453125, 538)"><rect class="basic label-container" style="" rx="5" ry="5" x="-41.453125" y="-20" width="82.90625" height="40"/><g class="label" style="" transform="translate(-33.453125, -12)"><rect/><foreignObject width="66.90625" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel markdown-node-label"><p>Accepted</p></span></div></foreignObject></g></g><g class="node statediagram-note" id="my-svg-state-Pending----note-2" data-look="classic" transform="translate(158, 538)"><g class="basic label-container outer-path"><path d="M-115 -207 L115 -207 L115 207 L-115 207" stroke="none" stroke-width="0" fill="#fff5ad" style=""/><path d="M-115 -207 C-63.064802815542535 -207, -11.12960563108507 -207, 115 -207 M-115 -207 C-66.09776588427425 -207, -17.195531768548506 -207, 115 -207 M115 -207 C115 -65.83889391113141, 115 75.32221217773719, 115 207 M115 -207 C115 -75.88783201479009, 115 55.224335970419816, 115 207 M115 207 C63.27308636355031 207, 11.546172727100625 207, -115 207 M115 207 C42.40302222394686 207, -30.193955552106274 207, -115 207 M-115 207 C-115 57.36823968512661, -115 -92.26352062974678, -115 -207 M-115 207 C-115 62.18641377553095, -115 -82.6271724489381, -115 -207" stroke="#aaaa33" stroke-width="1.3" fill="none" stroke-dasharray="0 0" style=""/></g><g class="label noteLabel" style="" transform="translate(-100, -192)"><rect/><foreignObject width="200" height="384"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel markdown-node-label"><p>Two shapes never reach this state at all, as of ADR 0006.<br />Mg refuses a subject that is not a PROFILE id, which is<br />what lineage was, and Mr refuses a self-issued record<br />unless it is a credential binding. Both used to mint and<br />then sit here for ever, because A5 wants a user token<br />that an attestation mint never creates.</p></span></div></foreignObject></g></g><g class="node statediagram-note" id="my-svg-state-Accepted----note-3" data-look="classic" transform="translate(384.453125, 992)"><g class="basic label-container outer-path"><path d="M-115 -147 L115 -147 L115 147 L-115 147" stroke="none" stroke-width="0" fill="#fff5ad" style=""/><path d="M-115 -147 C-57.02381537818263 -147, 0.9523692436347346 -147, 115 -147 M-115 -147 C-50.648997006598776 -147, 13.702005986802448 -147, 115 -147 M115 -147 C115 -67.55252878711664, 115 11.894942425766715, 115 147 M115 -147 C115 -78.93293606819664, 115 -10.865872136393278, 115 147 M115 147 C63.49345182659825 147, 11.986903653196507 147, -115 147 M115 147 C34.03842851315143 147, -46.92314297369714 147, -115 147 M-115 147 C-115 33.169626608075674, -115 -80.66074678384865, -115 -147 M-115 147 C-115 56.847969931598854, -115 -33.30406013680229, -115 -147" stroke="#aaaa33" stroke-width="1.3" fill="none" stroke-dasharray="0 0" style=""/></g><g class="label noteLabel" style="" transform="translate(-100, -132)"><rect/><foreignObject width="200" height="264"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel markdown-node-label"><p>Written once (A3 refuses a second accept), and since D-C the<br />pause reaches this write too (A7, read through the datum's<br />own attestationOracleToken).<br />Never deleted, never hidden; a dispute sits beside it.</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>